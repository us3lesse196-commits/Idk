<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carta: maqueta</title>
<style>
html,body{margin:0;height:100%;background:#1c1626;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
</style></head><body>
<canvas id="c"></canvas>
<script>
// Maqueta: cuaderno con la carta. Tocar la pantalla cambia cuántos pedazos tienes.
const cv=document.getElementById('c'),g=cv.getContext('2d');
const P=3;// tamaño de cada "píxel" del dibujo
let CH=540,CW=960;
function hash(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);return (n^(n>>>15))>>>0}
const rnd=(x,y)=>(hash(x*73856093^y*19349663)%1000)/1000;
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

// ---------------- carta (baja resolución para el dibujo, texto en alta)
const LW=118,LH=160;
const letterLo=mk(LW,LH);
(()=>{const f=letterLo.getContext('2d'),d=f.createImageData(LW,LH),q=d.data,blobs=[],ins=9;
  for(let x=ins;x<=LW-ins;x+=8){blobs.push([x,ins+(hash(x)%4)-2,6+hash(x*3)%3]);blobs.push([x,LH-ins-(hash(x+7)%4)+2,6+hash(x*5)%3])}
  for(let y=ins;y<=LH-ins;y+=8){blobs.push([ins+(hash(y*7)%4)-2,y,6+hash(y)%3]);blobs.push([LW-ins-(hash(y*11)%4)+2,y,6+hash(y*13)%3])}
  for(const [cx,cy] of [[11,11],[LW-11,11],[11,LH-11],[LW-11,LH-11]])blobs.push([cx,cy,11]);
  for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){let cl=0;for(const [cx,cy,r] of blobs){const dd=Math.hypot(x-cx,y-cy)/r;if(dd<1)cl=Math.max(cl,1-dd)}
    const inner=x>14&&x<LW-15&&y>14&&y<LH-15,i=(y*LW+x)*4;if(!cl&&!inner)continue;
    let col=[245,238,220].map(v=>v+(hash(x*977+y*131)%7)-3);
    const ex=Math.min(x,LW-1-x,y,LH-1-y);let b=cl>0||!inner?Math.max(0,1-(ex-3)/17):0;if(inner)b*=.55;
    const k=Math.floor(Math.min(1,b*1.1)*5+BAY[(y&3)*4+(x&3)]/16)/5;
    const bc=k>.8?[70,86,132]:k>.5?[110,128,170]:[176,190,214];if(k>.05)col=col.map((v,j)=>v+(bc[j]-v)*Math.min(1,k*1.1));
    if(cl>0&&cl<.14&&!inner&&ex<9)col=[58,66,104];q[i]=col[0];q[i+1]=col[1];q[i+2]=col[2];q[i+3]=255}
  f.putImageData(d,0,0);
  f.strokeStyle='#3a4268';f.lineWidth=1;
  const sw=(x,y,r,dr)=>{f.beginPath();for(let a=0;a<Math.PI*3.1;a+=.3){const rr=r*(1-a/(Math.PI*3.5));const px=Math.round(x+Math.cos(a*dr)*rr)+.5,py=Math.round(y+Math.sin(a*dr)*rr)+.5;a?f.lineTo(px,py):f.moveTo(px,py)}f.stroke()};
  for(const [x,y,r,dr] of [[22,7,4,1],[LW-24,8,4,-1],[6,46,3,1],[LW-6,80,3,-1],[6,118,3,-1],[44,LH-7,4,-1],[LW-44,LH-8,4,1],[70,6,3,1]])sw(x,y,r,dr);
  const star=(x,y,r)=>{f.fillStyle='#f2d45a';f.strokeStyle='#8a6a2a';f.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.45:r;k?f.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):f.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}f.closePath();f.fill();f.stroke()};
  for(const [x,y,r] of [[12,12,4.5],[24,7,3],[LW-13,11,4.5],[LW-26,16,3],[11,LH-14,4.5],[23,LH-8,3],[LW-12,LH-12,4]])star(x,y,r);})();
const TEASER=/teaser/.test(location.search);
const LINES=[['Para ti',.1,1]];{const G=[['Ya sé que lo digo mucho,','que me cuesta expresarme, pero...'],['Créeme que yo siento mucho,','siento demasiado,','pero no sé por qué no sale nada.'],['Mi amor es como una llamita','que nunca piensa apagarse.'],['Esa llama ha pasado de todo','y no se ha apagado,','y nunca lo hará.'],['Pase lo que pase,','seguirá encendida.','Siempre, por ti.']];
  let v=.185;for(const gr of G){for(const l of gr){LINES.push([l,v]);v+=.045}v+=.03}}
const letterHi=mk(LW*P,LH*P);
(()=>{const f=letterHi.getContext('2d');f.imageSmoothingEnabled=false;f.drawImage(letterLo,0,0,LW*P,LH*P);f.textAlign='center';
  for(const [t,v,title] of LINES){f.fillStyle=title?'#6a5a8a':'#3a3058';f.font=(title?'italic 600 17px ':'italic 14px ')+'Georgia,serif';const y=v*LH*P+5;f.fillText(t,LW*P/2,y);
    if(TEASER&&!title){const w=f.measureText(t).width,x0=LW*P/2-w/2-4;f.strokeStyle='#2a2240';f.lineCap='round';
      for(let pass=0;pass<3;pass++){f.lineWidth=2.2-pass*.5;f.beginPath();let s0=hash(t.length*31+pass*7);for(let x=x0;x<=x0+w+8;x+=5){const yy=y-4+Math.sin((x+s0)*.35+pass)*2.6+((hash(Math.round(x)*13+pass)%3)-1);x===x0?f.moveTo(x,yy):f.lineTo(x,yy)}f.stroke()}}}})();

// ---------------- cortes irregulares: a cada píxel de la carta le toca un pedazo
const ID=new Uint8Array(LW*LH);
for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){const u=x/LW,v=y/LH;
  const uu=u+.035*Math.sin(v*21+1)+.025*(rnd(x>>1,y)-.5),vv=v+.03*Math.sin(u*17+2)+.025*(rnd(x,y>>1)-.5);
  let id;if(vv<.29-.09*uu)id=0;else if(vv<.6+.07*uu-.1*Math.max(0,uu-.7))id=(uu<.47+.25*(vv-.3))?1:2;else id=(uu+.6*(vv-.6)<.5)?3:4;ID[y*LW+x]=id}
// lienzos de cada pedazo (alta resolución) + silueta para la sombra
const PIECES=[];
for(let k=0;k<5;k++){const m=mk(LW,LH),mg=m.getContext('2d'),md=mg.createImageData(LW,LH);let sx=0,sy=0,n=0;
  for(let i=0;i<ID.length;i++){if(ID[i]!==k)continue;const x=i%LW,y=(i/LW)|0;const a=letterLo.getContext('2d');md.data[i*4+3]=255;sx+=x;sy+=y;n++;
    const edge=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const X=x+dx,Y=y+dy;return X>=0&&Y>=0&&X<LW&&Y<LH&&ID[Y*LW+X]!==k});
    if(edge){md.data[i*4]=255;md.data[i*4+1]=250;md.data[i*4+2]=238}else{md.data[i*4]=md.data[i*4+1]=md.data[i*4+2]=0}}
  mg.putImageData(md,0,0);
  // quitar las esquinas del papel que quedan fuera de la carta (transparentes)
  const pc=mk(LW*P,LH*P),pg=pc.getContext('2d');pg.imageSmoothingEnabled=false;pg.drawImage(letterHi,0,0);pg.globalCompositeOperation='destination-in';pg.drawImage(m,0,0,LW*P,LH*P);
  pg.globalCompositeOperation='source-over';
  // borde blanco de papel rasgado
  const e=mk(LW,LH),eg=e.getContext('2d'),ed=eg.createImageData(LW,LH);for(let i=0;i<ID.length;i++)if(md.data[i*4]===255&&letterLo.getContext('2d'))ed.data.set([255,250,238,255],i*4);eg.putImageData(ed,0,0);
  pg.globalCompositeOperation='source-atop';pg.drawImage(e,0,0,LW*P,LH*P);pg.globalCompositeOperation='source-over';
  const sh=mk(LW*P,LH*P),sg=sh.getContext('2d');sg.drawImage(pc,0,0);sg.globalCompositeOperation='source-in';sg.fillStyle='rgba(40,25,20,.35)';sg.fillRect(0,0,LW*P,LH*P);
  PIECES.push({c:pc,sh,cx:sx/n*P,cy:sy/n*P})}
// ¡las esquinas de nube fuera del papel no son pedazo de nadie! (transparencia del dibujo)
// cómo quedó pegado cada pedazo: desplazamiento, giro y cinta
const STUCK=[{r:-.02,tape:[[.2,.15,-.5],[.82,.2,.4]]},{r:.015,tape:[[.25,.45,.3]]},{r:-.012,tape:[[.85,.5,-.4]]},{r:.022,tape:[[.15,.85,.5]]},{r:-.016,tape:[[.8,.9,-.3],[.55,.62,.2]]}];
const NOTES=['Cayó del árbol junto al templo, después de la tormenta.','Estaba en el basurero de la prepa; el conserje lo tiró en la tarde.','El zorro de la aurora lo traía en la espalda.','Arriba de todo, en lo alto del callejón.','Un gato jugaba con él frente a la cafetería.'];
let have=[1,0,1,0,1],t=0,doneT=0,stage=1;
const STAGES=[[0,0,0,0,0],[1,0,1,0,1],[1,1,1,1,1]];
cv.onclick=()=>{stage=(stage+1)%3;have=STAGES[stage];doneT=0};

function resize(){const a=innerWidth/innerHeight;CH=TEASER?900:540;CW=Math.round(CH*(TEASER?a:Math.max(1.3,Math.min(2.4,a))));cv.width=CW;cv.height=CH}
addEventListener('resize',resize);resize();

function notebook(){// fondo de escritorio + cuaderno abierto que ocupa toda la pantalla
  g.fillStyle='#3a2a24';g.fillRect(0,0,CW,CH);for(let y=0;y<CH;y+=9){g.fillStyle=y%18?'#40302a':'#36261f';g.fillRect(0,y,CW,3)}
  const m=14,x0=m,x1=CW-m,y0=m,y1=CH-m,mid=CW/2;
  g.fillStyle='#5a3a4a';g.fillRect(x0-6,y0-6,x1-x0+12,y1-y0+12);// tapa
  g.fillStyle='#f3ead6';g.fillRect(x0,y0,x1-x0,y1-y0);
  for(let y=y0+54;y<y1-12;y+=24){g.fillStyle='rgba(120,150,200,.35)';g.fillRect(x0+12,y,mid-x0-30,2);g.fillRect(mid+18,y,x1-mid-30,2)}
  g.fillStyle='rgba(210,90,90,.45)';g.fillRect(x0+54,y0,2,y1-y0);
  const gr=g.createLinearGradient(mid-40,0,mid+40,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,'rgba(60,30,20,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(mid-40,y0,80,y1-y0);
  for(let y=y0+20;y<y1;y+=34){g.fillStyle='#b8a888';g.fillRect(mid-3,y,6,12);g.fillStyle='#8a7a5a';g.fillRect(mid-1,y+2,2,8)}
  return {x0,x1,y0,y1,mid}}

function flame(cx,by,tt,s){// llama pixelada (s = tamaño de píxel)
  const glow=g.createRadialGradient(cx,by-8*s,2,cx,by-8*s,34*s/3);glow.addColorStop(0,'rgba(255,190,90,.5)');glow.addColorStop(1,'rgba(255,190,90,0)');g.fillStyle=glow;g.fillRect(cx-40*s/3,by-26*s,80*s/3,34*s);
  const L=[[7,'#d9473a'],[5,'#f08a3a'],[3.4,'#f6c24a'],[1.8,'#fff4c8']];
  for(let li=0;li<4;li++){const [w,col]=L[li];g.fillStyle=col;const hgt=15-li*3.1;
    for(let y=0;y<hgt;y++){const u=y/hgt,sway=Math.sin(tt*.18+y*.45+li)*u*1.5+Math.sin(tt*.07)*u*.8,ww=w*(1-u*u)*(1+.15*Math.sin(tt*.3+y));if(ww<.5)continue;
      g.fillRect(Math.round(cx/s-ww/2+sway)*s,Math.round(by/s-y-li*.6)*s,Math.max(1,Math.round(ww))*s,s)}}
  for(let k=0;k<3;k++){const p=((tt*.6+k*37)%60)/60;g.fillStyle=`rgba(255,220,140,${1-p})`;g.fillRect(Math.round(cx/s+Math.sin(k*2+tt*.05)*4)*s,Math.round(by/s-14-p*18)*s,s,s)}
  g.fillStyle='#e8e0d0';g.fillRect(cx-3*s,by+s,6*s,7*s);g.fillStyle='#c8bca8';g.fillRect(cx+s,by+s,2*s,7*s);g.fillStyle='#3a3058';g.fillRect(cx,by-s,s,2*s)}

function teaser(){t++;g.imageSmoothingEnabled=false;g.fillStyle='#1c1626';g.fillRect(0,0,CW,CH);const gl=g.createRadialGradient(CW/2,CH*.55,20,CW/2,CH*.55,CH*.7);gl.addColorStop(0,'rgba(255,170,90,.18)');gl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gl;g.fillRect(0,0,CW,CH);
  const sc=Math.min(CH*.74/(LH*P),CW*.88/(LW*P)),lw=LW*P*sc,lh=LH*P*sc,lx=CW/2-lw/2,ly0=(CH-lh)/2-CH*.07;
  for(let k=0;k<5;k++){const p=PIECES[k],s=STUCK[k];if(s.dx==null){const ox=p.cx-LW*P/2,oy=p.cy-LH*P/2,L=Math.hypot(ox,oy)||1;s.dx=ox/L*9+(k%2?2:-2);s.dy=oy/L*9}g.save();g.translate(lx+p.cx*sc+s.dx*.45,ly0+p.cy*sc+s.dy*.45);g.rotate(s.r);g.scale(sc,sc);
    g.drawImage(p.sh,-p.cx+5,-p.cy+6);g.drawImage(p.c,-p.cx,-p.cy);for(const [tu,tv,tr] of s.tape){g.save();g.translate(tu*LW*P-p.cx,tv*LH*P-p.cy);g.rotate(tr);g.fillStyle='rgba(240,226,180,.62)';g.fillRect(-26,-9,52,18);g.restore()}g.restore()}
  flame(CW/2,ly0+lh+CH*.08,t,Math.max(3,Math.round(sc*3)));
  g.textAlign='center';g.fillStyle='#f4ead6';g.font='italic 600 '+Math.round(CH*.035)+'px Georgia,serif';g.fillText('Warm Dreams',CW/2,ly0+lh+CH*.17);
  requestAnimationFrame(teaser)}
function draw(){if(TEASER)return teaser();t++;g.imageSmoothingEnabled=false;const nb=notebook(),n=have.reduce((a,b)=>a+b,0);
  // página izquierda: notas de Haru
  g.textAlign='left';g.fillStyle='#4a3a5a';g.font='italic 600 26px Georgia,serif';g.fillText('La carta',nb.x0+70,nb.y0+42);
  g.font='italic 15px Georgia,serif';g.fillStyle='#7a6a8a';g.fillText('Pedazos: '+n+' / 5',nb.x0+70,nb.y0+66);
  let ly=nb.y0+102;for(let k=0;k<5;k++){g.fillStyle=have[k]?'#3a3058':'rgba(90,80,110,.45)';g.font=(have[k]?'italic 16px ':'16px ')+'Georgia,serif';
    const txt=have[k]?NOTES[k]:'· · ·';const words=txt.split(' ');let line='',yy=ly;const maxW=nb.mid-nb.x0-110;
    g.fillText((k+1)+'.',nb.x0+70,yy);for(const w of words){const tst=line?line+' '+w:w;if(g.measureText(tst).width>maxW){g.fillText(line,nb.x0+92,yy);line=w;yy+=22}else line=tst}g.fillText(line,nb.x0+92,yy);ly=yy+40}
  // página derecha: pedazos pegados
  const sc=Math.min((nb.y1-nb.y0-40)/(LH*P),(nb.x1-nb.mid-60)/(LW*P)),lw=LW*P*sc,lh=LH*P*sc,lx=nb.mid+(nb.x1-nb.mid)/2-lw/2-(n===5?30:0),ly0=nb.y0+(nb.y1-nb.y0-lh)/2;
  for(let k=0;k<5;k++){if(!have[k])continue;const p=PIECES[k],s=STUCK[k];if(s.dx==null){const ox=p.cx-LW*P/2,oy=p.cy-LH*P/2,L=Math.hypot(ox,oy)||1;s.dx=ox/L*9+(k%2?2:-2);s.dy=oy/L*9}g.save();g.translate(lx+p.cx*sc+s.dx,ly0+p.cy*sc+s.dy);g.rotate(s.r);g.scale(sc,sc);
    g.drawImage(p.sh,-p.cx+5,-p.cy+6);g.drawImage(p.c,-p.cx,-p.cy);
    for(const [tu,tv,tr] of s.tape){g.save();g.translate(tu*LW*P-p.cx,tv*LH*P-p.cy);g.rotate(tr);g.fillStyle='rgba(240,226,180,.62)';g.fillRect(-26,-9,52,18);g.fillStyle='rgba(255,255,255,.25)';g.fillRect(-26,-9,52,3);g.restore()}
    g.restore()}
  if(n===0){g.textAlign='center';g.fillStyle='rgba(90,80,110,.5)';g.font='italic 18px Georgia,serif';g.fillText('(aquí pegaré los pedazos que encuentre)',lx+lw/2,ly0+lh/2)}
  if(n===5){doneT++;g.globalAlpha=Math.min(1,doneT/50);flame(lx+lw+52,ly0+lh-30,t,3);g.globalAlpha=1}
  g.textAlign='right';g.font='13px Georgia,serif';g.fillStyle='rgba(255,255,255,.35)';g.fillText('maqueta · toca para cambiar',CW-20,CH-2);
  requestAnimationFrame(draw)}
draw();
</script></body></html>
