<title>Ruta de Prepa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Juego a pantalla completa, horizontal. Un solo look (nocturno/cálido), sin tema claro. */
:root{
  --ink:#fff4e2;
  --ink-dim:#e9d9c6;
  --panel:rgba(24,18,44,.55);
  --panel-edge:rgba(255,226,190,.32);
  --accent:#ffb46a;
  --ground:#0b0c20;
  --ui:"Pixelify Sans", "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--ui)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--ground)}
.hud-top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px;z-index:5}
.chip{font-family:var(--ui);font-size:13px;color:var(--ink);background:var(--panel);border:2px solid var(--panel-edge);
  padding:6px 10px;border-radius:2px;letter-spacing:.04em;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.chip:active{transform:translateY(1px);box-shadow:none}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip small{display:block;font-size:9px;color:var(--ink-dim);opacity:.8;letter-spacing:.12em;text-transform:uppercase}
#zone{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 16px);z-index:5;
  font-size:18px;letter-spacing:.06em;text-shadow:0 2px 0 rgba(0,0,0,.45);opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#zone small{display:block;font-size:10px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:2px}
#zone.show{opacity:1}
.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;z-index:5}
#dpad{left:calc(env(safe-area-inset-left,0px) + 18px)}
#acts{right:calc(env(safe-area-inset-right,0px) + 18px);align-items:flex-end}
.btn{width:64px;height:64px;display:grid;place-items:center;font-size:22px;color:var(--ink);background:var(--panel);
  border:2px solid var(--panel-edge);border-radius:4px;box-shadow:0 3px 0 rgba(0,0,0,.35);touch-action:none}
.btn.on{background:rgba(255,180,106,.35);transform:translateY(2px);box-shadow:none}
#bJump{width:74px;height:74px}
.touch-hide .pad{display:none}
#start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(180deg,rgba(12,10,32,.25),rgba(12,10,32,.7));cursor:pointer;padding:0 16px}
#start .box{text-align:center;max-width:520px}
#start h1{font-size:clamp(28px,6vw,46px);margin:0 0 4px;letter-spacing:.04em;font-weight:600;text-shadow:0 3px 0 #6b2f4a}
#start .tag{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
#start .go{display:inline-block;font-size:16px;padding:10px 18px;border:2px solid var(--panel-edge);background:var(--panel);animation:pulse 2.2s ease-in-out infinite}
#start .keys{margin-top:16px;font-size:12px;color:var(--ink-dim);line-height:1.6}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){#start .go{animation:none}}
#rotate{position:fixed;inset:0;z-index:30;display:none;place-items:center;text-align:center;background:var(--ground);padding:0 24px;font-size:18px;line-height:1.5}
#rotate .ico{font-size:44px;display:block;margin-bottom:10px;animation:spin 2.4s ease-in-out infinite}
@keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:grid}}
</style>

<canvas id="game" aria-label="Juego: estudiante explorando la ciudad"></canvas>

<div id="zone"><small>Zona</small><span id="zoneName"></span></div>

<div class="hud-top">
  <button class="chip" id="btnTime" type="button"><small>Hora</small><span>Atardecer</span></button>
  <button class="chip" id="btnWeather" type="button"><small>Clima</small><span>Despejado</span></button>
  <button class="chip" id="btnSound" type="button"><small>Sonido</small><span>Sí</span></button>
</div>

<div class="pad" id="dpad">
  <div class="btn" data-k="left" aria-label="Izquierda">◀</div>
  <div class="btn" data-k="right" aria-label="Derecha">▶</div>
</div>
<div class="pad" id="acts">
  <div class="btn" data-k="down" aria-label="Agacharse">▼</div>
  <div class="btn" id="bJump" data-k="jump" aria-label="Saltar">▲</div>
</div>

<div id="start">
  <div class="box">
    <div class="tag">Prueba visual · versión 0.1</div>
    <h1>Ruta de Prepa</h1>
    <div class="go">Toca para empezar</div>
    <div class="keys">
      ◀ ▶ caminar · ▲ saltar · ▼ agacharse<br>
      Corre y agáchate para deslizarte · salta contra un muro para rebotar<br>
      Teclado: flechas o WASD, espacio para saltar
    </div>
  </div>
</div>

<div id="rotate"><div><span class="ico">📱</span>Gira tu celular<br>Este juego se juega en horizontal</div></div>

<script>
(()=>{
"use strict";
// ======================= Base =======================
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const H=180, LW=2600, GY=150;
let W=320;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const worldB=mk(W,H), lightB=mk(W,H), tmpB=mk(W,H);
const wctx=worldB.getContext('2d'), lctx=lightB.getContext('2d'), tctx=tmpB.getContext('2d');
let vignette=mk(W,H);
function resize(){
  const a=innerWidth/Math.max(1,innerHeight);
  W=Math.max(220,Math.min(440,Math.round(H*a)));
  for(const c of [cv,worldB,lightB,tmpB]){c.width=W;c.height=H}
  vignette=mk(W,H);const g=vignette.getContext('2d');
  const gr=g.createRadialGradient(W/2,H*0.55,H*0.35,W/2,H*0.55,W*0.75);
  gr.addColorStop(0,'rgba(12,6,30,0)');gr.addColorStop(1,'rgba(12,6,30,0.42)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
}
addEventListener('resize',resize);resize();

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=x=>{let h=Math.imul(x|0,374761393)^0x5bd1e995;h=Math.imul(h^h>>>13,1274126177);return(h^h>>>16)>>>0};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sstep=t=>t*t*(3-2*t);
const R=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
function disc(c,cx,cy,r,col){c.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy+r*0.6));c.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2+1,1)}}

// Fuente pixel 3x5 para letreros
const FONT={P:["111","101","111","100","100"],R:["110","101","110","101","101"],E:["111","100","110","100","111"],A:["010","101","111","101","101"],
  "7":["111","001","010","010","010"],T:["111","010","010","010","010"],I:["111","010","010","010","111"],N:["101","111","111","101","101"],
  D:["110","101","101","101","110"],B:["110","101","110","101","110"],U:["101","101","101","101","111"],S:["011","100","010","001","110"],O:["010","101","101","101","010"]};
function txt(c,s,x,y,col){c.fillStyle=col;let cx=x;for(const ch of s){const g=FONT[ch];if(g)for(let r=0;r<5;r++)for(let k=0;k<3;k++)if(g[r][k]==='1')c.fillRect(cx+k,y+r,1,1);cx+=4}}
const txtW=s=>s.length*4-1;

// Sprites de luz
function glow(col){const c=mk(64,64),g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,css(col,1));gr.addColorStop(.3,css(col,.5));gr.addColorStop(.65,css(col,.14));gr.addColorStop(1,css(col,0));g.fillStyle=gr;g.fillRect(0,0,64,64);return c}
const GL={hole:glow([255,255,255]),warm:glow([255,196,120]),cool:glow([150,205,255]),cyan:glow([110,255,225]),tv:glow([140,160,255]),sun:glow([255,214,150]),moon:glow([200,215,255]),fire:glow([210,255,140])};

// ======================= Nivel =======================
const solids=[], oneways=[], groundRects=[];
const S=(x,y,w,h,g)=>{const r={x,y,w,h};solids.push(r);if(g)groundRects.push(r)};
const O=(x,y,w)=>oneways.push({x,y,w,h:3});
const lamps=[], lights=[], dripPts=[], puddles=[], trees=[];
const levelC=mk(LW,H), emisC=mk(LW,H);
const L=levelC.getContext('2d'), E=emisC.getContext('2d');
const lr=rng(7);

const ZONES=[[0,280,'Colonia Las Jacarandas','Barrio'],[280,900,'Preparatoria No. 7','Escuela'],[900,1500,'Avenida del Sol','Ciudad'],[1500,2250,'Campos de Altamira','Afueras'],[2250,LW,'La Piedra Antigua','Lugar místico']];

function window_(x,y,w,h,frame,glass,litChance,litCol,lightKind){
  R(L,x-1,y-1,w+2,h+2,frame);R(L,x,y,w,h,glass);
  R(L,x+2,y,2,h,'rgba(255,255,255,.22)');R(L,x+6,y,1,h,'rgba(255,255,255,.14)');
  R(L,x,y+h-2,w,2,'rgba(0,0,0,.12)');
  if(lr()<litChance){R(E,x,y,w,h,litCol);R(E,x+1,y+h-3,w-2,3,'rgba(255,240,200,.5)');lights.push({x:x+w/2,y:y+h/2,r:16,kind:lightKind||'warm',s:.55})}
}
function tinaco(x,y,s){R(L,x,y,10*s,9*s,'#2b2b33');R(L,x+1,y-1,10*s-2,1,'#3c3c47');R(L,x+2,y+1,2,9*s-2,'#45454f');R(L,x-1,y+9*s,10*s+2,2,'#57535c')}
function lamp(x){
  R(L,x,96,2,54,'#3b3e4c');R(L,x-1,146,4,4,'#2c2e39');R(L,x,96,9,2,'#3b3e4c');R(L,x+6,98,6,3,'#2a2c37');R(L,x+7,101,4,1,'#f4e7c0');
  R(E,x+7,101,4,2,'#fff1c0');lamps.push({x:x+9,y:102});lights.push({x:x+9,y:110,r:52,kind:'warm',s:1,lamp:1});
}
function pole(x){R(L,x,38,3,112,'#6b5242');R(L,x+1,38,1,112,'#7d6150');R(L,x-8,42,19,2,'#5a4436');R(L,x-7,40,1,2,'#cfcfd6');R(L,x+8,40,1,2,'#cfcfd6')}
function wires(x0,x1){for(const [dy,sag] of [[41,9],[45,12]]){for(let x=x0;x<=x1;x++){const t=(x-x0)/(x1-x0);R(L,x,dy+sag*4*t*(1-t),1,1,'#1f1d26')}}}
function birds(x,y){R(L,x,y-2,3,2,'#24222c');R(L,x+2,y-3,2,1,'#24222c');R(L,x+3,y-3,1,1,'#e2a03a')}
function tree(x,base,top,r,cols,kind,trunk){
  R(L,x-2,top,5,base-top,trunk||'#5a4134');R(L,x-1,top,1,base-top,'#6d5143');R(L,x-4,base-2,9,2,trunk||'#5a4134');
  const tr=rng(x);
  for(let i=0;i<9;i++){disc(L,x+(tr()-.5)*r*1.5,top-r*0.4+(tr()-.5)*r*0.8,Math.round(r*0.45+tr()*r*0.25),cols[0])}
  for(let i=0;i<7;i++){disc(L,x+(tr()-.6)*r*1.2,top-r*0.6+(tr()-.6)*r*0.6,Math.round(r*0.3+tr()*r*0.15),cols[1])}
  for(let i=0;i<5;i++){disc(L,x+(tr()-.75)*r,top-r*0.75+(tr()-.7)*r*0.4,Math.round(r*0.15+tr()*r*0.1),cols[2])}
  for(let i=0;i<60;i++){R(L,x+(tr()-.5)*r*2,top-r*0.5+(tr()-.5)*r*1.2,1,1,cols[tr()<.5?2:0])}
  trees.push({x,y:top-r*0.4,r,kind});
}
function bush(x,y,w,cols){const br=rng(x*3);for(let i=0;i<w/5;i++)disc(L,x+i*5+br()*3,y,4+Math.round(br()*2),cols[0]);for(let i=0;i<w/7;i++)disc(L,x+i*7+3,y-2,2+Math.round(br()*2),cols[1])}

function buildLevel(){
  // ---------- Suelo ciudad ----------
  R(L,0,150,1500,2,'#ddd5c7');R(L,0,152,1500,5,'#ada395');
  for(let x=0;x<1500;x+=20)R(L,x,152,1,5,'#8f8578');
  R(L,0,157,1500,1,'#6c645e');R(L,0,158,1500,22,'#3c3945');
  for(let x=6;x<1500;x+=28)R(L,x,169,12,1,'#b9984c');
  for(let i=0;i<300;i++)R(L,lr()*1500,159+lr()*20,1,1,'rgba(255,255,255,.06)');
  // ---------- Suelo campo ----------
  R(L,1500,150,LW-1500,2,'#86c35f');R(L,1500,152,LW-1500,3,'#5f9a46');R(L,1500,155,LW-1500,25,'#6a4a3a');
  for(let i=0;i<500;i++){const c=lr()<.5?'#5a3e31':'#7b5846';R(L,1500+lr()*(LW-1500),156+lr()*24,1+Math.round(lr()),1,c)}
  R(L,1496,150,4,8,'#8f8578');
  S(0,150,LW,30,1);

  // ---------- Casas ----------
  const houses=[[18,92,52,'#e39a86','#c9806e','#8a3f3a'],[132,100,44,'#8ec0b1','#72a596','#4f4565']];
  for(const [x,w,h,wall,shade,roof] of houses){
    const top=150-h;
    R(L,x,top,w,h,wall);R(L,x,150-10,w,10,shade);R(L,x,150-11,w,1,'rgba(0,0,0,.12)');
    R(L,x-3,top-3,w+6,3,'#efe6d6');R(L,x-3,top,w+6,1,'rgba(0,0,0,.18)');
    // puerta
    R(L,x+w-26,150-26,14,26,roof);R(L,x+w-24,150-24,10,22,'#3d2f3a');R(L,x+w-16,150-13,1,1,'#e5c06a');
    // ventanas con herrería
    for(let i=0;i<2;i++){const wx=x+8+i*24,wy=top+10;window_(wx,wy,14,14,'#f2eadb','#7fa8c8',.85,'#ffcf86');
      for(let k=0;k<14;k+=4)R(L,wx+k,wy,1,14,'#2c2a33');R(L,wx,wy+6,14,1,'#2c2a33');
      R(L,wx-1,wy+15,16,3,'#a35a3a');R(L,wx,wy+13,3,2,'#e05570');R(L,wx+6,wy+13,3,2,'#f2b84a');R(L,wx+11,wy+13,3,2,'#e05570');R(L,wx+1,wy+14,12,1,'#4f8a3c')}
    tinaco(x+w-22,top-14,1);
    O(x-3,top-3,w+6);
    dripPts.push({x:x-3,y:top},{x:x+w+2,y:top},{x:x+w*0.4,y:top});
  }
  bush(14,148,40,['#4d8a45','#6fb05a']);bush(234,148,36,['#4d8a45','#6fb05a']);
  tree(118,150,108,16,['#7e62b8','#9f84d8','#c4acf0'],'jaca');
  lamp(250);

  // ---------- Prepa ----------
  const sx=300,sw=580,st=62;
  R(L,sx,st,sw,88,'#edd9b3');
  for(let i=0;i<180;i++)R(L,sx+lr()*sw,st+lr()*70,2,1,'rgba(160,120,80,.08)');
  R(L,sx,100,sw,2,'#d6c096');R(L,sx,134,sw,16,'#c46a4c');R(L,sx,133,sw,1,'#a4553d');
  for(let x=sx;x<sx+sw;x+=12)R(L,x,134,1,16,'rgba(0,0,0,.1)');
  R(L,sx-4,57,sw+8,6,'#c46a4c');R(L,sx-4,57,sw+8,1,'#e48d6c');R(L,sx-4,62,sw+8,1,'rgba(0,0,0,.2)');
  for(let row=0;row<2;row++)for(let i=0;i<16;i++){const wx=sx+12+i*35;if(wx>548&&wx<628)continue;
    const wy=row?106:70;window_(wx,wy,22,20,'#5d4e66','#88b4d6',row?.3:.45,'#ffd98c');R(L,wx+10,wy,2,20,'#5d4e66');R(L,wx-2,wy+20,26,2,'#f6ecd6');
    if(lr()<.4)R(L,wx,wy,22,5+Math.round(lr()*6),'#e9e0c6')}
  // entrada
  R(L,560,104,60,46,'#d8c39a');R(L,566,108,48,42,'#4b3f52');
  R(L,570,112,19,38,'#3f7a65');R(L,591,112,19,38,'#3f7a65');R(L,572,114,15,16,'#9cc6d8');R(L,593,114,15,16,'#9cc6d8');
  R(L,587,132,1,3,'#e5c06a');R(L,592,132,1,3,'#e5c06a');R(E,572,114,15,16,'#ffe2a0');R(E,593,114,15,16,'#ffe2a0');
  lights.push({x:590,y:124,r:30,kind:'warm',s:.7});
  R(L,554,146,72,4,'#d7cfc2');R(L,558,143,64,3,'#e2dbcf');
  R(L,545,116,90,3,'#2f5d73');R(L,545,119,90,1,'#1f4052');R(L,548,119,2,27,'#2b2d38');R(L,630,119,2,27,'#2b2d38');O(545,116,90);
  for(let x=548;x<634;x+=14)dripPts.push({x,y:119});
  // letrero
  R(L,553,74,74,17,'#f6ecd6');R(L,555,76,70,13,'#2f5d73');txt(L,'PREPA 7',590-Math.floor(txtW('PREPA 7')/2),80,'#fff4e2');
  // torre del reloj
  R(L,574,34,32,24,'#edd9b3');R(L,571,31,38,4,'#c46a4c');R(L,571,31,38,1,'#e48d6c');O(571,31,38);
  disc(L,590,45,7,'#5d4e66');disc(L,590,45,6,'#fbf6ea');R(L,590,40,1,5,'#2c2a33');R(L,590,45,4,1,'#2c2a33');
  R(E,586,41,9,9,'rgba(255,240,200,.6)');
  O(sx-4,57,sw+8);
  dripPts.push({x:sx-4,y:63},{x:sx+sw+3,y:63});for(let x=sx+40;x<sx+sw;x+=90)dripPts.push({x,y:63});
  // escalera de emergencia
  for(const y of [128,106,84]){R(L,278,y,22,2,'#3b3a48');R(L,278,y-6,1,6,'#3b3a48');R(L,278,y-6,22,1,'#3b3a48');O(278,y,22)}
  R(L,280,84,1,66,'#3b3a48');R(L,297,84,1,66,'#3b3a48');for(let y=86;y<150;y+=5)R(L,281,y,4,1,'#4d4c5c');
  // bajante pluvial
  R(L,303,62,3,85,'#8a8f9c');R(L,303,62,1,85,'#a7acb8');R(L,303,145,7,3,'#8a8f9c');
  // tinaco grande en la azotea
  tinaco(820,38,2);S(819,38,22,20);
  // antena + tendedero
  R(L,700,40,1,17,'#55535f');R(L,696,42,9,1,'#55535f');R(L,693,45,15,1,'#55535f');
  // jacarandas y bancas
  tree(462,150,100,24,['#7a5db5','#9b7fd6','#c8b0f2'],'jaca');
  tree(770,150,104,22,['#7a5db5','#9b7fd6','#c8b0f2'],'jaca');
  R(L,676,142,26,2,'#8a5f43');R(L,678,144,2,6,'#3b3a48');R(L,698,144,2,6,'#3b3a48');R(L,676,137,26,2,'#8a5f43');
  bush(330,148,60,['#3f7b3f','#5fa24f']);bush(640,148,40,['#3f7b3f','#5fa24f']);
  // cajas para escalar
  R(L,256,136,18,14,'#9a6b45');R(L,256,136,18,1,'#c08a5c');R(L,256,142,18,1,'#7a5236');R(L,264,136,1,14,'#7a5236');S(256,136,18,14);

  const tw=Math.round(Math.sin(t*.06)*1.5);R(c,sx-1,sy-7+tw,4,2,C);R(c,sx-3,sy-9+tw,3,2,C2);// cola
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function draw(){
  const N=sky.night,lampsOn=clamp((N+st.rain*.45-.25)*2.5,0,1);
  drawSky();
  // parallax
  const far=mix(mix(sky.hor,sky.mid,.45),sky.dark,.18),city=mix(sky.hor,sky.dark,.45),hill=mix(sky.hor,sky.dark,.68);
  tinted(farC,.08,far,1,0);
  tinted(cityC,.2,city,1,2);
  if(lampsOn>.05){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=lampsOn*.8;const w=cityW.width,ox=-(((camX*.2)%w)+w)%w;for(let x=ox;x<W;x+=w)ctx.drawImage(cityW,Math.round(x),2);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
  // niebla baja entre capas
  const fg=ctx.createLinearGradient(0,95,0,150);fg.addColorStop(0,css(sky.hor,0));fg.addColorStop(1,css(sky.hor,.35+st.rain*.25));ctx.fillStyle=fg;ctx.fillRect(0,95,W,55);
  tinted(hillC,.45,hill,1,4);

  // ---- mundo ----
  wctx.globalCompositeOperation='source-over';wctx.clearRect(0,0,W,H);
  wctx.drawImage(levelC,camX,0,W,H,0,0,W,H);
  drawGrass(wctx);
  // hojas en mundo
  for(const l of leaves){const sx=Math.round(l.x-camX);if(sx<-2||sx>W+2)continue;wctx.fillStyle=l.col;if(l.land||Math.sin(l.ph*2)>0)wctx.fillRect(sx,Math.round(l.y),2,1);else wctx.fillRect(sx,Math.round(l.y),1,2)}
  drawPlayer(wctx);
  for(const d of dust){wctx.fillStyle=`rgba(225,210,190,${clamp(d.life/d.m,0,1)*.8})`;wctx.fillRect(Math.round(d.x-camX),Math.round(d.y),1,1)}
  // mojado + tinte + oscuridad
  wctx.globalCompositeOperation='source-atop';
  if(st.wet>0){wctx.fillStyle=`rgba(18,22,48,${st.wet*.26})`;wctx.fillRect(0,0,W,H)}
  wctx.fillStyle=css(sky.tint,sky.tint[3]);wctx.fillRect(0,0,W,H);
  if(st.rain>.02){wctx.fillStyle=`rgba(70,80,105,${st.rain*.18})`;wctx.fillRect(0,0,W,H)}
  const darkA=N*.52+st.rain*.12*(1-N);
  if(darkA>.01){lctx.globalCompositeOperation='source-over';lctx.clearRect(0,0,W,H);lctx.fillStyle=css(mix([12,16,48],[30,30,60],st.rain),darkA);lctx.fillRect(0,0,W,H);
    lctx.globalCompositeOperation='destination-out';
    for(const l of lights){const sx=l.x-camX;if(sx<-l.r||sx>W+l.r)continue;let s=l.s*(l.rune?(.6+.4*N):lampsOn);if(l.rune)s*=.75+.25*Math.sin(st.time*.04);lctx.globalAlpha=clamp(s,0,1);lctx.drawImage(GL.hole,sx-l.r,l.y-l.r,l.r*2,l.r*2)}
    if(fox.a>.05){lctx.globalAlpha=fox.a*.8;lctx.drawImage(GL.hole,fox.x+6-camX-22,fox.y-28,44,44)}
    lctx.globalAlpha=1;lctx.globalCompositeOperation='source-over';
    wctx.drawImage(lightB,0,0)}
  wctx.globalCompositeOperation='source-over';
  ctx.drawImage(worldB,0,0);

  // brillo mojado en superficies
  if(st.wet>.05){ctx.fillStyle=css(mix(sky.hor,[255,255,255],.3),st.wet*.35);for(const r of [...solids,...oneways]){const sx=r.x-camX;if(sx>W||sx+r.w<0)continue;ctx.fillRect(Math.round(sx),r.y,Math.round(r.w),1)}}
  // charcos
  for(const pd of puddles){const w=puddleW(pd);if(w<2)continue;const sx=pd.x-camX;if(sx+w<0||sx-w>W)continue;const l=Math.round(sx-w/2),ww=Math.round(w);
    const refl=mix(sky.mid,sky.top,.35);ctx.fillStyle=css(refl);ctx.fillRect(l,pd.y,ww,2);ctx.fillRect(l+2,pd.y+2,Math.max(0,ww-4),1);ctx.fillStyle=css(mix(refl,[0,0,0],.25));ctx.fillRect(l+2,pd.y+2,Math.max(0,ww-4),1);
    ctx.fillStyle=css(mix(sky.hor,[255,255,255],.25));ctx.fillRect(l+1,pd.y,Math.max(1,Math.round(ww*.35)),1);
    ctx.fillStyle=css(mix(refl,[255,255,255],.35),.9);for(const rp of pd.rip){const a=Math.round(rp.r);ctx.fillRect(Math.round(sx+rp.x-a),pd.y+1,1,1);ctx.fillRect(Math.round(sx+rp.x+a),pd.y+1,1,1)}
    if(lampsOn>.05){ctx.globalCompositeOperation='lighter';for(const lp of lamps){if(Math.abs(lp.x-pd.x)<w/2+2){ctx.fillStyle=`rgba(255,200,120,${lampsOn*.8})`;ctx.fillRect(Math.round(lp.x-camX)-1,pd.y,3,2+((st.time>>3)%2))}}ctx.globalCompositeOperation='source-over'}}
  // luces emisivas
  if(lampsOn>.02){ctx.globalAlpha=lampsOn*.92;ctx.drawImage(emisC,camX,0,W,H,0,0,W,H);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=lampsOn*.18;ctx.drawImage(emisC,camX,0,W,H,0,0,W,H);ctx.globalAlpha=1;
    for(const l of lights){const sx=l.x-camX;if(sx<-l.r||sx>W+l.r||l.rune)continue;ctx.globalAlpha=lampsOn*l.s*(l.lamp?.42:.22);const r=l.lamp?l.r*.8:l.r*.7;ctx.drawImage(GL[l.kind],sx-r,l.y-r-(l.lamp?6:0),r*2,r*2)}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
  // runas de la piedra (siempre brillan un poco)
  {const sx=2356-camX;if(sx>-40&&sx<W+40){const pul=.5+.5*Math.sin(st.time*.04);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(.1+N*.28)*(.6+.4*pul);
    ctx.drawImage(GL.cyan,sx-14,104,54,54);ctx.globalAlpha=(.5+N*.5)*(.7+.3*pul);ctx.fillStyle='#8ffff0';
    for(const [rx,ry,rw,rh] of [[8,122,1,4],[9,124,3,1],[14,121,1,5],[15,121,2,1],[16,123,1,1],[8,132,4,1],[10,130,1,5],[15,131,1,3],[17,131,1,3],[15,134,3,1],[11,140,1,4],[14,140,1,1],[13,142,3,1]])ctx.fillRect(Math.round(sx+rx),ry,rw,rh);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}}
  // gotas y salpicaduras
  ctx.fillStyle=css(mix(sky.hor,[220,235,255],.6),.9);
  for(const d of drops){const sx=Math.round(d.x-camX);if(d.g>0)ctx.fillRect(sx,d.y,1,d.g>9?1:2);else ctx.fillRect(sx,Math.round(d.y),1,2)}
  for(const s of splash)ctx.fillRect(Math.round(s.x-camX),Math.round(s.y),1,1);
  // lluvia
  if(rain.length){ctx.strokeStyle=css(mix(sky.hor,[200,215,240],.55),.55);ctx.lineWidth=1;ctx.beginPath();
    for(const d of rain){const x=d.x-camX+.5;ctx.moveTo(x,d.y);ctx.lineTo(x-st.wind*1.6*d.l/4,d.y-d.l)}ctx.stroke()}
  // luciérnagas, zorro, chispas
  const fa=N*(1-st.rain)*.95;
  if(fa>.03){ctx.globalCompositeOperation='lighter';for(const f of flies){const sx=f.x-camX;if(sx<-5||sx>W+5)continue;const b=fa*(.4+.6*Math.max(0,Math.sin(st.time*.05+f.ph)));
    ctx.globalAlpha=b*.7;ctx.drawImage(GL.fire,sx-5,f.y-5,10,10);ctx.globalAlpha=b;ctx.fillStyle='#eaffb0';ctx.fillRect(Math.round(sx),Math.round(f.y),1,1)}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
  drawFox(ctx,fox.x,fox.y,fox.a);
  if(sparks.length){ctx.globalCompositeOperation='lighter';for(const s of sparks){const a=clamp(s.life/50,0,1);ctx.globalAlpha=a;ctx.fillStyle=s.col==='cyan'?'#9ffff0':'#c8d8ff';ctx.fillRect(Math.round(s.x-camX),Math.round(s.y),1,1)}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
  // primer plano
  tinted(fgC,1.35,mix(sky.dark,[8,8,20],.6),.92,0);
  // bruma de lluvia, destello, viñeta
  if(st.rain>.02){ctx.fillStyle=css(mix(sky.hor,[150,160,180],.5),st.rain*.12);ctx.fillRect(0,0,W,H)}
  if(sky.sunset>.05){const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(255,150,90,0)');g.addColorStop(1,`rgba(255,160,90,${sky.sunset*.12})`);ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}
  if(st.flash>.02){ctx.fillStyle=`rgba(230,235,255,${st.flash*.55})`;ctx.fillRect(0,0,W,H)}
  ctx.drawImage(vignette,0,0);
}

// ======================= HUD =======================
const zoneEl=document.getElementById('zone'),zoneName=document.getElementById('zoneName');
function showZone(z){zoneEl.querySelector('small').textContent=z[3];zoneName.textContent=z[2];zoneEl.classList.add('show');clearTimeout(zoneTimer);zoneTimer=setTimeout(()=>zoneEl.classList.remove('show'),3800)}
const PHASES=[['Amanecer',.25],['Día',.42],['Atardecer',.715],['Noche',.93]];
const phaseName=t=>t<.2||t>=.81?(st.aurora>.5?'Noche · aurora':'Noche'):t<.31?'Amanecer':t<.66?'Día':'Atardecer';
const bT=document.getElementById('btnTime'),bW=document.getElementById('btnWeather'),bS=document.getElementById('btnSound');
bT.addEventListener('click',()=>{const t=st.timeTarget??st.dayT;let nx=PHASES.find(p=>p[1]>t+.01);if(!nx)nx=PHASES[0];st.timeTarget=nx[1]});
const WN=['Despejado','Lluvia','Tormenta'];
bW.addEventListener('click',()=>{st.weather=(st.weather+1)%3;bW.querySelector('span').textContent=WN[st.weather]});
bS.addEventListener('click',()=>{soundOn=!soundOn;bS.querySelector('span').textContent=soundOn?'Sí':'No';if(master)master.gain.setTargetAtTime(soundOn?.7:0,AC.currentTime,.1)});

// ======================= Controles =======================
const keymap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump'};
addEventListener('keydown',e=>{const k=keymap[e.code];if(k){input[k]=1;e.preventDefault()}if(!started)begin()});
addEventListener('keyup',e=>{const k=keymap[e.code];if(k)input[k]=0});
const touch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
if(!touch)document.body.classList.add('touch-hide');
// cada pad sigue sus dedos: deslizar entre botones funciona
for(const pad of document.querySelectorAll('.pad')){
  const btns=[...pad.querySelectorAll('.btn')],ptrs=new Map();
  const refresh=()=>{for(const b of btns){const on=[...ptrs.values()].includes(b);b.classList.toggle('on',on);input[b.dataset.k]=on?1:0}};
  const pick=(x,y)=>{let best=null,bd=1e9;for(const b of btns){const r=b.getBoundingClientRect();const d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2));if(d<bd){bd=d;best=b}}return bd<90?best:null};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,pick(e.clientX,e.clientY));refresh()});
  pad.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,pick(e.clientX,e.clientY));refresh()});
  const up=e=>{ptrs.delete(e.pointerId);refresh()};pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
}
document.addEventListener('contextmenu',e=>e.preventDefault());

let started=false;const startEl=document.getElementById('start');
function begin(){if(started)return;started=true;startEl.hidden=true;initAudio();
  try{const d=document.documentElement;if(touch&&d.requestFullscreen)d.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})}catch(e){}
  lastZone=-1}
startEl.addEventListener('pointerup',begin);

// ======================= Bucle =======================
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=1000/60&&n<4){update();acc-=1000/60;n++}
  draw();if(started)musicTick();
  const pn=phaseName(st.dayT);const sp=bT.querySelector('span');if(sp.textContent!==pn)sp.textContent=pn;
  requestAnimationFrame(frame)}
computeSky();requestAnimationFrame(frame);
window.__dbg={st,player,set:(t,w,wet)=>{st.dayT=t;if(w!=null){st.weather=w;st.rain=[0,.6,1][w];st.cloud=[.2,.85,1][w];bW.querySelector('span').textContent=WN[w]}if(wet!=null)st.wet=wet},go:x=>{player.x=x;player.y=100;camXf=x-W/2}};
})();
